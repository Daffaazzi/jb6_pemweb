<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KameraHub | Daftar Anggota</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>KameraHub</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu" aria-expanded="false" aria-controls="main-nav">&#9776;</button>
        <nav id="main-nav" aria-label="Navigasi utama">
            <ul>
                <li><a href="../login.html">Login 🔐</a></li>
                <li><a href="../index.html">Beranda 🏠</a></li>
                <li><a href="../buku/list.html">Daftar Kamera 📷</a></li>
                <li><a href="../buku/tambah.html">Tambah Kamera ➕</a></li>
                <li><a href="list.html" aria-current="page">Daftar Anggota 👥</a></li>
                <li><a href="tambah.html">Tambah Anggota ➕</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Daftar Anggota 👥</h2>
            <div class="search-box">
                <label for="search-input">Cari Anggota</label>
                <input type="text" id="search-input" placeholder="Ketik nama, alamat, atau no. anggota...">
            </div>
            <p id="loading-indicator" role="status" hidden>Memuat data...</p>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">No. Anggota</th>
                            <th scope="col">Nama</th>
                            <th scope="col">Alamat</th>
                            <th scope="col">No. HP</th>
                            <th scope="col">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                    <!-- Baris diisi dinamis oleh assets/js/anggota.js via fetch('../data/anggota.json') -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 KameraHub &mdash; Jobsheet 6</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/anggota.js"></script>
</body>
</html>
